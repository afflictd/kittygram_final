name: Kittygram CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kittygram-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: kittygram
          POSTGRES_USER: kittygram
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kittygram -d kittygram"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-for-production
      POSTGRES_DB: kittygram
      POSTGRES_USER: kittygram
      POSTGRES_PASSWORD: test-password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Check backend with Ruff
        run: ruff check backend/
      - name: Check formatting and Python style
        run: |
          ruff format --check backend/
          pycodestyle backend/
      - name: Check Django and migrations
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Test backend with PostgreSQL
        run: python backend/manage.py test cats --verbosity 2

  frontend_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test frontend
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: 'true'

  build_and_push_images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend_tests, frontend_tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: backend
            image: kittygram_backend
          - context: frontend
            image: kittygram_frontend
          - context: nginx
            image: kittygram_gateway
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub configuration
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$DOCKER_USERNAME" || { echo 'Set DOCKER_USERNAME in Actions secrets'; exit 1; }
          test -n "$DOCKER_PASSWORD" || { echo 'Set DOCKER_PASSWORD in Actions secrets'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  send_message:
    needs: build_and_push_images
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram after publishing all images
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual workflow run' }}
        run: |
          test -n "$TELEGRAM_TOKEN" || { echo 'Set TELEGRAM_TOKEN in Actions secrets'; exit 1; }
          test -n "$TELEGRAM_TO" || { echo 'Set TELEGRAM_TO in Actions secrets'; exit 1; }
          COMMIT_MESSAGE="${COMMIT_MESSAGE:0:1000}"
          curl --fail --silent --show-error --output /dev/null \
            --request POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=Kittygram: тесты пройдены, три образа опубликованы. Автор: ${ACTOR}. ${COMMIT_MESSAGE}. https://github.com/${REPOSITORY}/commit/${COMMIT}"
          echo 'Telegram notification delivered'
