exclude: ^backend/.*/migrations/

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Format Python with Ruff
        entry: ruff format
        language: python
        additional_dependencies: [ruff==0.11.13]
        types: [python]
        files: ^backend/

      - id: ruff-check
        name: Check Python with Ruff
        entry: ruff check --fix
        language: python
        additional_dependencies: [ruff==0.11.13]
        types: [python]
        files: ^backend/

      - id: pycodestyle
        name: Check Python style
        entry: pycodestyle
        language: python
        additional_dependencies: [pycodestyle==2.12.1]
        types: [python]
        files: ^backend/
